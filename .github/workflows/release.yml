name: Release

# Publishes the GitHub release for ddtools.__version__, with its CHANGELOG.md section.
# Either push a tag vX.Y.Z, or press "Run workflow" (Actions → Release): that creates
# the tag on the latest master for you.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Work out the tag
        run: |
          set -euo pipefail
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/ddtools/__init__.py').read())[1])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but __version__ is $version"; exit 1; }
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Not released already
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released: bump __version__ first."; exit 1
          fi
      - name: Build
        run: |
          pip install "$(grep '^build==' requirements-dev.txt)"
          python -m build
      - name: Notes from CHANGELOG.md
        run: |
          # The section under "## <version>", up to the next "## ".
          awk -v v="## $VERSION" '$0 ~ "^"v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $VERSION"; exit 1; }
      - name: Create the release (and the tag, if it isn't there yet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "ddtools $TAG" --notes-file notes.md
